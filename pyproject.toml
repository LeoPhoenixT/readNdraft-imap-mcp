[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readndraft-imap-mcp"
version = "0.8.0"
description = "Capability-minimized IMAP MCP service"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "LeoPhoenixT" }]
keywords = ["mcp", "imap", "email", "draft", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email :: Post-Office :: IMAP",
]
dependencies = [
  "css-inline==0.21.0",
  "keyring==25.7.0",
  "mcp[cli]==1.29.0",
  "nh3==0.3.6",
  "SecretStorage==3.5.0; sys_platform == 'linux'",
  "tinycss2==1.5.1",
  "tinyhtml5==2.1.0",
]

[project.urls]
Homepage = "https://github.com/LeoPhoenixT/readNdraft-imap-mcp"
Repository = "https://github.com/LeoPhoenixT/readNdraft-imap-mcp"
Issues = "https://github.com/LeoPhoenixT/readNdraft-imap-mcp/issues"

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.15.0",
]

[project.scripts]
readndraft-imap-mcp = "readndraft_imap_mcp.cli:main"
readndraft-admin = "readndraft_imap_mcp.admin.cli:main"
readndraft-broker = "readndraft_imap_mcp.broker.daemon:main"
readndraft-client-config = "readndraft_imap_mcp.platform.client_config:main"

[project.gui-scripts]
readndraft-mcp = "readndraft_imap_mcp.mcp_server.server:main"
readndraft-launch = "readndraft_imap_mcp.platform.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readndraft_imap_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/readndraft_imap_mcp",
  "plugins/readndraft/skills/readndraft-email",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]
