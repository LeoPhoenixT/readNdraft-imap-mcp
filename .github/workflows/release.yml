name: Publish release to PyPI

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version change
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          current = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          before = os.environ["BEFORE_SHA"]
          previous_text = subprocess.check_output(
              ["git", "show", f"{before}:pyproject.toml"], text=True
          )
          previous = tomllib.loads(previous_text)["project"]["version"]
          changed = current != previous

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"release={'true' if changed else 'false'}\n")
              handle.write(f"version={current}\n")
              handle.write(f"tag=v{current}\n")
              handle.write(f"sha={os.environ['RELEASE_SHA']}\n")

          print(f"Project version: {previous} -> {current}")
          print("Release requested." if changed else "Version unchanged; release skipped.")
          PY

  test:
    needs: [prepare]
    if: needs.prepare.outputs.release == 'true'
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Verify release metadata and version synchronization
        run: |
          uv run --locked python scripts/release_check.py --tag "${{ needs.prepare.outputs.tag }}"
          uv run --locked python scripts/validate_plugin_versions.py

      - name: Run tests
        run: uv run --locked pytest

      - name: Lint
        run: uv run --locked ruff check src

      - name: Enforce capability and secret policy
        run: uv run --locked python scripts/security_check.py

      - name: Audit installed dependencies
        run: uv run --locked pip-audit --local --cache-dir .pip-audit-cache

      - name: Enforce dependency license policy
        run: uv run --locked python scripts/license_check.py

  build:
    needs: [prepare, test]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl scripts/release_smoke.py

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/release_smoke.py

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ needs.prepare.outputs.sha }}
          path: dist/

  tag:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create immutable release tag
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            ACTUAL_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${ACTUAL_SHA}" != "${RELEASE_SHA}" ]; then
              echo "Existing ${RELEASE_TAG} points to ${ACTUAL_SHA}, expected ${RELEASE_SHA}." >&2
              exit 1
            fi
            echo "${RELEASE_TAG} already points to the intended release commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  publish:
    needs: [prepare, build, tag]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.prepare.outputs.sha }}
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish through trusted identity
        run: uv publish --trusted-publishing always

  release:
    needs: [prepare, publish]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release create "${RELEASE_TAG}"
          --verify-tag
          --title "readNdraft IMAP MCP ${RELEASE_TAG}"
          --generate-notes
