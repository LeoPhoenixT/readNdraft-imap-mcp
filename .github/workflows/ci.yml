name: Test and security

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/verify.yml
    with:
      sha: ${{ github.sha }}
      cache: true

  build:
    needs: [test]
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ github.sha }}
