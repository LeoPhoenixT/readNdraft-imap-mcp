name: Test and security

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --locked pytest

      - name: Enforce capability and secret policy
        run: uv run --locked python scripts/security_check.py

      - name: Audit installed dependencies
        run: uv run --locked pip-audit --local --cache-dir .pip-audit-cache

      - name: Enforce dependency license policy
        run: uv run --locked python scripts/license_check.py

      - name: Build package
        run: uv build --no-sources
