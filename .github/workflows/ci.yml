name: Test and security

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      sha:
        description: Exact commit to verify
        required: true
        type: string
      release_tag:
        description: Release tag to validate when preparing a release
        required: false
        default: ""
        type: string
      cache:
        description: Cache uv dependencies for regular CI
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          enable-cache: ${{ !inputs.sha || inputs.cache }}

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python }}

      - name: Verify selected Python
        run: uv run --locked --python ${{ matrix.python }} python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python }}'.split('.'))), sys.version"

      - name: Verify release metadata and version synchronization
        if: inputs.release_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          uv run --locked --python ${{ matrix.python }} python scripts/release_check.py --tag "$RELEASE_TAG"
          uv run --locked --python ${{ matrix.python }} python scripts/validate_plugin_versions.py

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python }} pytest

      - name: Lint
        run: uv run --locked --python ${{ matrix.python }} ruff check src

      - name: Enforce capability and secret policy
        run: uv run --locked --python ${{ matrix.python }} python scripts/security_check.py

      - name: Audit installed dependencies
        run: uv run --locked --python ${{ matrix.python }} pip-audit --local --cache-dir .pip-audit-cache

      - name: Enforce dependency license policy
        run: uv run --locked --python ${{ matrix.python }} python scripts/license_check.py

  build:
    if: ${{ !inputs.sha }}
    needs: [test]
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ github.sha }}
