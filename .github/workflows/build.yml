name: Build distributions

on:
  workflow_call:
    inputs:
      sha:
        description: Exact commit to build
        required: true
        type: string
      artifact_name:
        description: Upload distributions under this name when provided
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          enable-cache: false

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl scripts/release_smoke.py

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/release_smoke.py

      - name: Upload distributions
        if: inputs.artifact_name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/
