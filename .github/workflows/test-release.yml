name: Publish release candidate to TestPyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag matching pyproject.toml (for example, v0.4.2)"
        required: true
        type: string
      release_sha:
        description: "Exact 40-character commit SHA to test and publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Validate immutable candidate SHA
        id: validate
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be an exact 40-character commit SHA, not a branch or tag." >&2
            exit 1
          fi
          echo "sha=${RELEASE_SHA,,}" >> "${GITHUB_OUTPUT}"

  test:
    needs: [prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      release_tag: ${{ inputs.release_tag }}

  build:
    needs: [prepare, test]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      artifact_name: testpypi-dist-${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/readndraft-imap-mcp
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-dist-${{ needs.prepare.outputs.sha }}
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish through TestPyPI trusted identity
        run: >-
          uv publish
          --publish-url https://test.pypi.org/legacy/
          --trusted-publishing always
